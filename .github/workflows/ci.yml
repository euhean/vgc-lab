name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The battle endpoints start the Node simulator in backend/sim.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/sim/package-lock.json
      - run: npm ci
        working-directory: backend/sim
      - run: npm test
        working-directory: backend/sim
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api-contract:
    # Fails when the backend API changes but the frontend's generated types were not regenerated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r backend/requirements.txt
      - run: python -m scripts.export_openapi ../frontend/openapi.json
        working-directory: backend
      - run: npm run gen:api
        working-directory: frontend
      - run: git diff --exit-code frontend/openapi.json frontend/src/api/schema.ts

  e2e:
    # Runs the whole stack (PostgreSQL, API, web) with Docker Compose and drives it with Playwright.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for the API
        run: timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
      - name: Load a usage report for the meta threats test
        run: >
          docker compose exec -T api python -m app.usage_stats --format gen9vgc2024regg --month 2026-10 --file -
          < backend/tests/fixtures/chaos-gen9vgc2024regg-1630.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
      - if: failure()
        run: docker compose logs
