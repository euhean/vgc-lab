services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vgc
      POSTGRES_PASSWORD: vgc
      POSTGRES_DB: vgc
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vgc"]
      interval: 2s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://vgc:vgc@db:5432/vgc
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-please}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db-data:
